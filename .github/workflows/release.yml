name: Release

# Builds the sdist + wheel in CI and publishes them to PyPI when a version tag
# is pushed. Uses PyPI trusted publishing (no API token stored in the repo):
# configure it once at https://pypi.org/manage/account/publishing/ for this
# repository + this workflow + the "pypi" environment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tagged commit is on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "tagged commit $GITHUB_SHA is not an ancestor of origin/master"; exit 1; }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the Kaitai Struct compiler (pinned JVM ksc 0.11)
        run: bash scripts/install_ksc.sh
      - name: Quality gate
        env:
          CI: "true"
        run: bash scripts/check.sh
      - name: Verify tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - name: Build
        run: python -m pip install --quiet build==1.6.1 && python -m build
      - name: Smoke-test the sdist and wheel (they must ship the generated Kaitai classes)
        run: bash scripts/smoke_artifacts.sh --no-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
