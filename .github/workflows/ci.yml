name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, security & tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the Kaitai Struct compiler (pinned JVM ksc 0.11)
        run: bash scripts/install_ksc.sh
      - name: Run quality gate
        env:
          CI: "true"  # makes pip-audit (no offline skip) and the pinned Kaitai compiler mandatory
        run: bash scripts/check.sh

  lowest-deps:
    name: Tests with lowest direct dependency versions (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the Kaitai Struct compiler (pinned JVM ksc 0.11)
        run: bash scripts/install_ksc.sh
      - name: Generate the Kaitai readers from spec/*.ksy
        run: bash tools/gen_kaitai.sh
      - name: Install lowest direct dependencies
        run: |
          python -m pip install --quiet --upgrade pip uv
          python -m venv .venv-lowest
          # Runtime deps at their declared floors; test tooling (unpinned) at latest.
          uv pip install --python .venv-lowest/bin/python --resolution lowest-direct -e ".[cloud]"
          uv pip install --python .venv-lowest/bin/python -e ".[test]"
      - name: Run tests
        run: .venv-lowest/bin/python -m pytest -q
