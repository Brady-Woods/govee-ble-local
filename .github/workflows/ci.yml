name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, security & tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run quality gate
        env:
          CI: "true"  # makes the pip-audit stage mandatory (no offline skip)
        run: bash scripts/check.sh

  lowest-deps:
    name: Tests with lowest direct dependency versions (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install lowest direct dependencies
        run: |
          python -m pip install --quiet --upgrade pip uv
          python -m venv .venv-lowest
          # Runtime deps at their declared floors; test tooling (unpinned) at latest.
          uv pip install --python .venv-lowest/bin/python --resolution lowest-direct -e ".[cloud]"
          uv pip install --python .venv-lowest/bin/python -e ".[test]"
      - name: Run tests
        run: .venv-lowest/bin/python -m pytest -q
