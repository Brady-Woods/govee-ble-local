[build-system]
requires = ["setuptools>=77"]
# setuptools, wrapped so every build first generates the Kaitai classes from spec/*.ksy (they are a
# build product, not committed); see _build_backend/govee_build_backend.py.
build-backend = "govee_build_backend"
backend-path = ["_build_backend"]

[project]
name = "govee-ble-local"
version = "1.3.0"
description = "Local Bluetooth LE control of Govee devices — no cloud, no LAN API."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brady Woods" }]
requires-python = ">=3.11"
keywords = ["govee", "bluetooth", "ble", "home-assistant", "led", "light"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "bleak>=0.21",
    "bleak-retry-connector>=3.0.0",
    # NO upper bound (issue #8). Home Assistant installs integration requirements with
    # `uv pip install --constraint homeassistant/package_constraints.txt`
    # (homeassistant/requirements.py, util/package.py), so inside HA cryptography always
    # resolves to HA core's own pin whatever this says. A ceiling here cannot prevent an
    # upgrade; it can only conflict with HA when HA moves past it, which is what #8 was
    # (`<49` vs HA 2026.10's ==50.0.1). Only stable core APIs are used (Cipher /
    # algorithms.AES / modes.ECB; RC4 is hand-rolled in crypto.py), so new majors are low-risk.
    # The floor is exercised by CI's lowest-direct-dependency job.
    "cryptography>=41.0.0",
    # Runtime wire codec: the spec/*.ksy-generated read-write classes under
    # govee_ble_local/_generated (ReadWriteKaitaiStruct + KaitaiStream) parse and build every frame,
    # so this is required at runtime. It is the ONE accepted non-HA-default dependency —
    # pure-Python, stdlib-only, zero-dep, MIT. The Kaitai *compiler* (the JVM ksc CLI) is a build
    # tool only: every build generates the classes (tools/gen_kaitai.sh via the in-tree backend) and
    # the sdist and wheel ship them; nothing generated is committed. 0.11 is the first runtime with
    # the read-write (serialization) API, so it is also the floor.
    # See CLAUDE.md for the dependency policy (bleak / bleak-retry-connector / cryptography
    # are HA defaults; new runtime deps need justification; never require a version ahead of HA).
    "kaitaistruct>=0.11",
]

[project.scripts]
# Decode a captured session (JSONL frame log, or a govee_ble_local.frames logger dump via
# --from-frames-log) and report spec coverage/gaps. Available from an installed wheel.
govee-ble-analyze = "govee_ble_local.debug:main"

[project.urls]
Homepage = "https://github.com/Brady-Woods/govee-ble-local"
Repository = "https://github.com/Brady-Woods/govee-ble-local"
Changelog = "https://github.com/Brady-Woods/govee-ble-local/blob/master/CHANGELOG.md"
Issues = "https://github.com/Brady-Woods/govee-ble-local/issues"

[project.optional-dependencies]
# Dev/test/docs only — NOT runtime. PyYAML + jsonschema validate spec/devices.yaml in the
# test suite (the runtime device table is hardcoded Python in devices/profile.py; nothing under
# src/ imports yaml). See CLAUDE.md for the dependency policy.
test = [
    "pytest", "pytest-asyncio", "pytest-cov", "jsonschema>=4.0", "PyYAML>=6.0", "aiohttp>=3.9",
    # Independent AES reference for tests/test_spec_reference_crosscheck.py. Test-only: never a
    # runtime dependency (the library itself uses `cryptography`).
    "pycryptodome",
]
cloud = ["aiohttp>=3.9"]
typing = ["mypy", "types-PyYAML"]
# Static analysis / supply-chain gates run by scripts/check.sh and CI.
lint = ["ruff", "bandit", "pip-audit"]
docs = ["pdoc"]
# Informational dead-code / complexity report (scripts/audit.sh); not a gate.
audit = ["vulture", "radon"]
# Everything a contributor needs for the full audit/validation workflow.
dev = ["govee-ble-local[test,cloud,typing,lint,audit]", "uv"]

[tool.pytest.ini_options]
# async fixtures/tests run without per-test markers
asyncio_mode = "auto"
# only collect the test suite; tools/*_test.py are CLIs, not pytest modules
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["src/govee_ble_local/_generated"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "S", "ASYNC", "RUF", "SIM", "BLE"]
ignore = [
    # Public API methods deliberately take a `timeout` parameter (it is the documented contract).
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# Developer-only CLIs/probes: fixed https URLs, best-effort cleanup, compact one-line probes.
"tools/*" = ["S101", "S310", "S110", "BLE001", "E702"]
# The Govee BLE protocol mandates AES-ECB; this is not a free choice.
"src/govee_ble_local/crypto.py" = ["S305"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["bleak_retry_connector", "aiohttp", "kaitaistruct"]
ignore_missing_imports = true

# Kaitai-generated readers — not hand-written, exclude from strict checking.
[[tool.mypy.overrides]]
module = ["govee_ble_local._generated.*"]
ignore_errors = true

[tool.vulture]
exclude = ["src/govee_ble_local/_generated"]
min_confidence = 80
paths = ["src"]

[tool.coverage.run]
source = ["govee_ble_local"]
# The Kaitai-generated readers are tested through the wire layer, not line-by-line.
omit = ["*/_generated/*"]

[tool.coverage.report]
show_missing = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
govee_ble_local = ["py.typed", "scenes/*.json"]
