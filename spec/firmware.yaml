      tick:
        let:
          clock: =state.ntp_synced or state.ble_time_set
          end0: =state.delay_end_ms[0]
          end1: =state.delay_end_ms[1]
          fire0: =clock and end0 is not None and -4000 <= end0 - now_ms <= 0
          fire1: =clock and end1 is not None and -4000 <= end1 - now_ms <= 0
          stale0: =clock and end0 is not None and end0 - now_ms < -4000
          stale1: =clock and end1 is not None and end1 - now_ms < -4000
        effects:
          - when: =fire0
            set: { state.relay0: 0 }
          - when: =fire1
            set: { state.relay0: 1 }
          - when: =fire0 or stale0
            set: { state.delay_minutes: "=[0, state.delay_minutes[1]]", state.delay_end_ms: "=[None, state.delay_end_ms[1]]" }
