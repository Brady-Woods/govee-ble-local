          - H5083 FUN_9b01ec46 @0x9b01ec68
      timer_fire:
        args: { hour: the device clock's hour, minute: its minute, weekday: its weekday 1..7 as the firmware counts it }
        let:
          due: "=[i for i in range(10) if state.timers[i]['flags'] & 0x80 and state.timers[i]['hour'] == event.hour and state.timers[i]['minute'] == event.minute and (state.timers[i]['repeat'] in (0, 0x80) or (state.timers[i]['repeat'] >> (event.weekday - 1)) & 1)]"
