          - when: =not held
            set: { state.relay0: =0 if any_off else 1 }
          - set:
              state.timers: "=[{'flags': state.timers[i]['flags'] & 0x7f, 'hour': state.timers[i]['hour'], 'minute': state.timers[i]['minute'], 'repeat': 0x80} if i in due and state.timers[i]['repeat'] == 0x80 else state.timers[i] for i in range(10)]"
          - push: power
        doc: |
          A scenario raises it once a minute of the device clock (the firmware's
          clock task checks every slot each second, once per minute each). The due
          timers are the enabled records at this hour and minute on a day they
          repeat (repeat 0x80 is once, 0 every day). Outlet 0 goes off if any due
          timer is off, else on, unless a delay has time left (the firmware also
          holds to the end of the minute a delay ends in, not modelled). Due
          one-shots disable themselves; one AA 01 push follows.
        doc-ref:
          - H5083 FUN_9b020dd8 @0x9b020dd8
          - H5083 FUN_9b020dd8 @0x9b021010-0x9b0210d8
          - H5083 FUN_9b020dd8 @0x9b02111c
          - H5083 FUN_9b021a20 @0x9b021a20
      cloud_turn:
        args: { value: the relay byte the cloud sent (as in 33 01) }
        effects:
          - when: =event.value & 0x10 != 0
            set: { state.relay0: =event.value & 1, state.delay_minutes: [0, 0], state.delay_end_ms: [null, null] }
          - push: power
        doc: a cloud 'turn' command takes the 33 01 path, then always pushes AA 01
        doc-ref:
          - H5083 FUN_9b01fd60 @0x9b01fe7a
          - H5083 FUN_9b01f5d0 @0x9b01f6d8-0x9b01f6ee
      cloud_status:
        effects:
          - push: power
        doc: a cloud 'status' request, which pushes AA 01
        doc-ref:
          - H5083 FUN_9b01fd60 @0x9b01fe04-0x9b01fe16
      cloud_connect:
        effects:
          - push: power
        doc: the device reached its MQTT server and reports its state, which re-sends AA 01
        doc-ref:
          - H5083 FUN_9b01d8ec @0x9b01daee
          - H5083 FUN_9b01d8ec @0x9b01db8a
      ntp_sync:
        effects:
          - set: { state.ntp_synced: true }
        doc: the clock synced from NTP
        doc-ref:
          - H5083 FUN_9b020dd8 @0x9b020dd8
