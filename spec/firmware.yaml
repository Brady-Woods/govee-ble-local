            set: { state.heartbeat_ticks: =state.heartbeat_ticks + 1 }
          - when: =state.session != 0 and state.heartbeat_ticks > 10
            disconnect: true
        doc: |
          The clock task, once a second. A delay ends within 4 s of its time:
          type 0 switches outlet 0 off, type 1 on; it then clears and pushes AA
          01 (one missed by more than 4 s just clears). The device drops a link
          after 61 s in pair state 1, and 10-11 s after the last write.
