doc: |
  Device behaviour, state and timing per firmware image, as data: what a device
  does with the frames the .ksy files describe. Schema: firmware.schema.json.
  Every reply, push and advert is a spec object named by type path and seq ids;
  a simulator builds them with no hand-built bytes. Firmware claims cite the
  image (IMAGE symbol @0xaddr, or a decompiled path:line); a claim about the app
  cites the app's decompile.

images:
  - id: h5083_sw1_00_30
    doc: |
      The H5083 Wi-Fi + BLE plug. A shared write layer decrypts every frame,
      runs the E7 exchange, checks the BCC and itself answers AA 06 / 07 / 14 /
      20 / 21 / EF, a complete A1 11, AB, 66 and 3F; it counts A1 11 and A3
      frames and passes them on, with everything else, to the per-SKU
      dispatcher, which is gated on pair state.
    doc-ref:
      - H5083 FUN_9b03289c @0x9b03289c
      - firmware-h5083-wifi/decompiled/H5083_ble_dispatcher.c:59-402
    sku: H5083
    goods_type: 43
    soft_version: 1.00.30
    hard_version: 1.02.00
    chip: RTL8720CF
    file: def58f4ab490f41bbb43feb7c4cbccce-H5083_WIFI_BLE_HW1.02.00_SW1.00.30_OTA.bin
    frame_len: 20

    profile:
      forms: { f_14: wifi_mac }
      doc: FIRMWARE-SOURCED, the firmware answers AA 14 with its Wi-Fi MAC (the app sends it only while adding the device)
      doc-ref:
        - H5083 ble_msg_get_wifi_mac_address @0x9b031a24
        - split_plugnew/com/govee/h5080/add/PairAcV1.java:652

    gatt:
      service: 00010203-0405-0607-0809-0a0b0c0d1910
      notify: 00010203-0405-0607-0809-0a0b0c0d2b10
      write: 00010203-0405-0607-0809-0a0b0c0d2b11
      bgc_info: false
      doc: no 2b12 characteristic; the advert flag 0x40 is the only sign of the cipher
      doc-ref:
        - H5083 data @0x9b80f7d9
        - H5083 data @0x9b80f826
        - H5083 data @0x9b80f87a
        - H5083 FUN_9b029774 @0x9b029774

    cipher: e7_v1

    advert:
      when: =state.session == 0 and state.adv_after_disconnect
      let:
        name: "='ihoment_%s_%02X%02X' % (image.sku, state.ble_mac[4], state.ble_mac[5])"
      adv:
        - { len_ad: 3, ad_type: appearance, data: [0, 0] }
        - len_ad: 8
          ad_type: manufacturer_specific
          data:
            type: govee_manufacturer_data
            flags: 0x43
            company_id: 0xec88
            pact_type: 2
            pact_code: 2
            device_state: "=bytes([state.relay0])"
      scan_response:
        - { len_ad: 2, ad_type: flags, data: { type: govee_scan_record::flags_data, flags: 5 } }
        - len_ad: =len(name) + 1
          ad_type: complete_local_name
          data: { type: govee_scan_record::local_name, raw: =name }
      doc: |
        [03 19 00 00][08 FF 43 88 EC 00 02 02 <switch>] and the scan response
        [02 01 05][13 09 <name>]. The name ends in the last two octets of the BLE
        MAC string, so it is always 18 chars, which sets flag 0x40 and pact 2 / 2
        in the template. The switch byte follows the relay. After 33 FF 04 05
        01 | 02, or the factory test, the device stops advertising at the next
        disconnect.
      doc-ref:
        - H5083 data @0x100007a6
        - H5083 data @0x1000078e
        - H5083 FUN_9b029774 @0x9b029774
        - H5083 FUN_9b029850 @0x9b029850
        - H5083 FUN_9b01e354 @0x9b01e39a-0x9b01e3d8
        - H5083 FUN_9b029a18 @0x9b029a18

    state:
      session:
        init: 0
        doc: 0 disconnected, 1 connected, 2 after E7 01, 3 after E7 02
        doc-ref:
          - H5083 data @0x10009b90
          - H5083 FUN_9b032d14 @0x9b032d14
      cipher:
        init: psk
        doc: the key frames are sent and read with, psk until E7 02 is answered, then session
        doc-ref:
          - H5083 FUN_9b032fb4 @0x9b032fb4
      session_key:
        init: =random_bytes(16)
        doc: the key E7 01 hands out, new on every connect
        doc-ref:
          - H5083 data @0x10009a80
          - H5083 FUN_9b032f98 @0x9b032f98
      pair_state:
        init: 0
        doc: 0 none, 1 pairing (after AA B1), 2 paired (after a matching 33 B2); every connect sets 0
        doc-ref:
          - H5083 data @0x10000654
          - H5083 FUN_9b021acc @0x9b021acc
          - H5083 FUN_9b01e354 @0x9b01e462
      relay0:
        init: 0
        doc: outlet 0, 0 off or 1 on; the advert switch byte mirrors it
        doc-ref:
          - H5083 data @0x10009448
          - H5083 FUN_9b021668 @0x9b021668
      secret:
        init: null
        persist: true
        doc: the 8-byte account-lock secret, made on the first AA B1 inside the button window
        doc-ref:
          - H5083 FUN_9b021894 @0x9b021894
          - H5083 FUN_9b021748 @0x9b021748
      fallback_secret:
        init: =random_bytes(8)
        doc: what 33 B2 is compared with while no secret is made, a keyed hash of the BLE MAC string (opaque here)
        doc-ref:
          - H5083 FUN_9b021928 @0x9b021962-0x9b0219a0
      last_key_ms:
        init: null
        doc: now_ms of the last button press (SHORT_KEY), for the AA B1 window
        doc-ref:
          - H5083 data @0x1000926c
          - H5083 FUN_9b01ec6e @0x9b01ec6e
      heartbeat_ticks:
        init: 0
        doc: seconds since the last GATT write
        doc-ref:
          - H5083 data @0x100093f0
          - H5083 FUN_9b020cfc @0x9b020cfc
      pair_key_ticks:
        init: 0
        doc: seconds spent in pair state 1
        doc-ref:
          - H5083 data @0x100093f4
          - H5083 FUN_9b020d14 @0x9b020d14
      timers:
        init: "=[{'flags': 0, 'hour': 0, 'minute': 0, 'repeat': 0} for i in range(10)]"
        persist: true
        doc: the 10 timer records of outlet 0 (timer_record fields); the clock task reads them whatever the used flags
        doc-ref:
          - H5083 FUN_9b021a20 @0x9b021a20
          - H5083 FUN_9b0219b0 @0x9b0219b0
      timer_used:
        init: =[False] * 10
        persist: true
        doc: each slot's used flag; the timer count is the number of leading used slots
        doc-ref:
          - H5083 FUN_9b0219e4 @0x9b0219e4
      delay_minutes:
        init: [0, 0]
        doc: the two delays' set minutes; type 0 switches the outlet off at its end, type 1 on
        doc-ref:
          - H5083 FUN_9b021674 @0x9b021674
          - H5083 FUN_9b020dd8 @0x9b020dd8
      delay_end_ms:
        init: [null, null]
        doc: now_ms when each delay ends, or None (the firmware keeps it on its own clock)
        doc-ref:
          - H5083 FUN_9b0216c0 @0x9b0216c0
      ntp_synced:
        init: false
        doc: the clock came from NTP
        doc-ref:
          - H5083 data @0x100093fa
          - H5083 FUN_9b020dd8 @0x9b020dd8
      ble_time_set:
        init: false
        doc: the clock came from 33 B5
        doc-ref:
          - H5083 data @0x100093f8
          - H5083 FUN_9b0214f0 @0x9b0214f0
      unix_s:
        init: null
        doc: the epoch 33 B5 last applied
        doc-ref:
          - H5083 FUN_9b0214f0 @0x9b0214f0
      tz_hour:
        init: 0
        doc: the timezone hour 33 B5 last applied
        doc-ref:
          - H5083 FUN_9b0214f0 @0x9b0214f0
      tz_min:
        init: 0
        doc: the timezone minute 33 B5 last applied
        doc-ref:
          - H5083 FUN_9b0214f0 @0x9b0214f0
      soft_version:
        init: =image.soft_version
        doc: the version string of AA 06 and AA 21
        doc-ref:
          - H5083 HAL_Ota_GetSWVersion @0x9b02b1c8
      hard_version:
        init: =image.hard_version
        doc: the version string of AA 07 03 and AA 20
        doc-ref:
          - H5083 data @0x9b809cc7
      device_id:
        init: =random_bytes(8)
        persist: true
        doc: the AA 07 02 id, as the reply carries it (the firmware reverses its stored uuid)
        doc-ref:
          - H5083 data @0x1000b140
          - H5083 ble_msg_get_sn @0x9b031924
      ble_mac:
        init: =random_bytes(6)
        doc: the BLE MAC in printed order (a scenario sets the link address)
        doc-ref:
          - H5083 ble_msg_get_ble_macaddress @0x9b0319cc
      wifi_mac:
        init: =random_bytes(6)
        doc: the Wi-Fi MAC, forward order
        doc-ref:
          - H5083 ble_msg_get_wifi_mac_address @0x9b031a24
      adv_after_disconnect:
        init: true
        doc: the device advertises again after a disconnect
        doc-ref:
          - H5083 data @0x100007b4
          - H5083 FUN_9b02a368 @0x9b02a368
      factory_test:
        init: false
        doc: CAUTION, the one-shot factory test some 33 FF starts
        doc-ref:
          - H5083 data @0x10009282
          - H5083 FUN_9b022ae4 @0x9b022ae4
      pact_type:
        init: 0
        persist: true
        doc: the pact AB 02 stores (it only rises); the factory value is not traced
        doc-ref:
          - H5083 FUN_9b032308 @0x9b032308
          - H5083 FUN_9b021ad8 @0x9b021ad8
      pact_code:
        init: 0
        persist: true
        doc: the pact code AB 02 stores with pact_type
        doc-ref:
          - H5083 FUN_9b032308 @0x9b032308
      diy_count:
        init: 0
        doc: A1 DIY START's data-packet count
        doc-ref:
          - H5083 data @0x10009284
      diy_counter:
        init: 0
        doc: A1 DIY data packets taken in order
        doc-ref:
          - H5083 data @0x10009283
      wifi_count:
        init: 0
        doc: A1 11 START's data-packet count
        doc-ref:
          - H5083 data @0x1000995d
      wifi_counter:
        init: 0
        doc: A1 11 data packets taken in order
        doc-ref:
          - H5083 data @0x1000995c
      upload_buf:
        init: =bytes(256)
        doc: the 256-byte buffer A1 11 and A3 uploads share, cleared by either START
        doc-ref:
          - H5083 data @0x10009966
          - H5083 ble_msg_receive_mult_package @0x9b031c4a
          - H5083 FUN_9b03289c @0x9b032972
      wifi_status:
        init: 0
        doc: the outcome of joining with accepted credentials, 0 connected; a scenario sets it
        doc-ref:
          - H5083 FUN_9b031e00 @0x9b031e00
      wifi_reason:
        init: 0
        doc: the failure reason with it, 2 / 3 Wi-Fi connect failures, 1 or 4..6 post-connect failures
        doc-ref:
          - H5083 FUN_9b031e00 @0x9b031f00
          - H5083 FUN_9b031e00 @0x9b032008
      iot_count:
        init: 0
        doc: A3 START's frame count (START and END included)
        doc-ref:
          - H5083 FUN_9b03289c @0x9b03289c
      iot_counter:
        init: 0
        doc: A3 frames taken since START
        doc-ref:
          - H5083 FUN_9b03289c @0x9b03289c
      iot_result:
        init: 0
        doc: the IoT server outcome, 0 connected; a scenario sets it
        doc-ref:
          - H5083 send_iot_status @0x9b031860

    accept:
      - id: handshake_first
        drop: =state.session in (1, 2) and frame.pro_type != pro_type.handshake
        doc: until E7 02 is answered, only the E7 handler sees frames
        doc-ref:
          - H5083 FUN_9b03289c @0x9b0328e2
      - id: checksum
        drop: =not checksum_ok
        doc: the XOR BCC is checked on the decrypted frame; a bad one gets no reply
        doc-ref:
          - H5083 FUN_9b031528 @0x9b031528
          - H5083 FUN_9b032fb4 @0x9b032fb4
      - id: length
        layer: dispatcher
        drop: =len(raw) != 20
        doc: the dispatcher takes only 20-byte frames; the shared layer has no length check
        doc-ref:
          - firmware-h5083-wifi/decompiled/H5083_ble_dispatcher.c:87-92

    answers:
      # ---- the shared write layer ----
      - id: e7_session_key
        layer: shared
        match: { route: handshake_tx, op: v1_request_session_key }
        when: =state.session in (1, 2)
        apply: after_reply
        effects:
          - set: { state.session: 2 }
        reply:
          route: handshake_rx
          fill: request
          body:
            op: v1_request_session_key
            key: { type: govee_ble_frame::session_key, key: =state.session_key }
        doc: E7 01 gets the session key (byte 18 echoed), PSK-encrypted; it may repeat
        doc-ref:
          - H5083 FUN_9b032fb4 @0x9b03301e-0x9b033028
      - id: e7_confirm
        layer: shared
        match: { route: handshake_tx, op: v1_confirm }
        when: =state.session in (1, 2)
        apply: after_reply
        effects:
          - set: { state.session: 3, state.cipher: session }
        reply: echo
        doc: E7 02 is echoed under the PSK, then the session key is used; E7 01 need not come first
        doc-ref:
          - H5083 FUN_9b032fb4 @0x9b033058-0x9b033064
      - id: soft_version
        layer: shared
        match: { route: read_tx, command: soft_version }
        when: =len(state.soft_version) <= 17
        reply:
          route: read_rx
          fill: request
          body:
            command: soft_version
            state: { body: { type: govee_common::version_text, raw: =state.soft_version } }
        doc: |
          AA 06, the version as ASCII from byte 2, at most 17 bytes. The firmware
          writes no NUL (the next byte is the request's); version_text writes one.
        doc-ref:
          - H5083 FUN_9b031bc0 @0x9b031bc0
          - H5083 ble_msg_get_version @0x9b0318dc
      - id: device_id
        layer: shared
        match: { route: read_tx, command: device_info, selector.selector: sn }
        reply:
          route: read_rx
          fill: request
          body:
            command: device_info
            state:
              body:
                type: govee_state::device_info_record
                selector: sn
                info: { type: govee_state::uid_record, uid: =state.device_id }
        doc: AA 07 02; AA 07 answers only 02 / 03 / 06, other selectors go on and are dropped
        doc-ref:
          - H5083 ble_msg_get_dev_info @0x9b031b08
          - H5083 ble_msg_get_sn @0x9b031924
      - id: hard_version
        layer: shared
        match: { route: read_tx, command: device_info, selector.selector: hard_version }
        when: =len(state.hard_version) <= 16
        reply:
          route: read_rx
          fill: request
          body:
            command: device_info
            state:
              body:
                type: govee_state::device_info_record
                selector: hard_version
                info: { type: govee_common::version_text, raw: =state.hard_version }
        doc: AA 07 03, ASCII from byte 3, at most 16 bytes (no NUL written; version_text writes one)
        doc-ref:
          - H5083 ble_msg_get_dev_info @0x9b031b0a-0x9b031b12
          - H5083 ble_msg_get_hw_version @0x9b031984
      - id: ble_mac
        layer: shared
        match: { route: read_tx, command: device_info, selector.selector: ble_mac }
        reply:
          route: read_rx
          fill: request
          body:
            command: device_info
            state:
              body:
                type: govee_state::device_info_record
                selector: ble_mac
                info: { type: govee_common::mac, addr: =state.ble_mac }
        doc: FIRMWARE-SOURCED, AA 07 06, the BLE MAC in printed order
        doc-ref:
          - H5083 ble_msg_get_ble_macaddress @0x9b0319cc
      - id: wifi_mac
        layer: shared
        match: { route: read_tx, command: cmd_14 }
        reply:
          route: read_rx
          fill: request
          body:
            command: cmd_14
            state:
              body:
                type: govee_state::cmd_14_state
                body: { type: govee_common::mac, addr: =state.wifi_mac }
        doc: AA 14, the Wi-Fi MAC, forward order
        doc-ref:
          - H5083 ble_msg_get_wifi_mac_address @0x9b031a24
      - id: wifi_hard_version
        layer: shared
        match: { route: read_tx, command: wifi_hard_version }
        when: =len(state.hard_version) <= 17
        reply:
          route: read_rx
          fill: request
          body:
            command: wifi_hard_version
            state: { body: { type: govee_common::version_text, raw: =state.hard_version } }
        doc: AA 20, the AA 07 03 string (one SoC; no NUL written, version_text writes one)
        doc-ref:
          - H5083 ble_msg_get_wifi_hwversion @0x9b031a78
      - id: wifi_soft_version
        layer: shared
        match: { route: read_tx, command: wifi_soft_version }
        when: =len(state.soft_version) <= 17
        reply:
          route: read_rx
          fill: request
          body:
            command: wifi_soft_version
            state: { body: { type: govee_common::version_text, raw: =state.soft_version } }
        doc: AA 21, the AA 06 string (one SoC; no NUL written, version_text writes one)
        doc-ref:
          - H5083 ble_msg_get_wifi_swversion @0x9b031ac0
      - id: pact
        layer: shared
        match: { route: read_tx, command: pact }
        reply:
          route: read_rx
          fill: request
          body:
            command: pact
            state: { body: { type: govee_state::pact_state, pact_type: 2, pact_code: 2 } }
        doc: FIRMWARE-SOURCED, AA EF, the constant 00 02 02
        doc-ref:
          - H5083 FUN_9b031b80 @0x9b031b80
      - id: wifi_start
        layer: shared
        match: { route: multi_write_tx, com_type: wifi, position: 0 }
        effects:
          - set: { state.wifi_count: =req.num_packets, state.wifi_counter: 0, state.upload_buf: =bytes(256) }
        forward: true
        doc: A1 11 START clears the upload buffer, no reply; the frame also goes on to the dispatcher
        doc-ref:
          - H5083 ble_msg_receive_mult_package @0x9b031c2c
      - id: wifi_data
        layer: shared
        match: { route: multi_write_tx, com_type: wifi }
        when: =req.position not in (0, 255)
        let:
          at: =(req.position - 1) * 16
        effects:
          - when: =req.position == state.wifi_counter + 1
            set: { state.wifi_counter: =state.wifi_counter + 1, state.upload_buf: "=state.upload_buf[:at] + req.chunk + state.upload_buf[at + 16:]" }
        forward: true
        doc: A1 11 DATA, 16 bytes each, taken only in order; no reply; the frame also goes on
        doc-ref:
          - H5083 ble_msg_receive_mult_package @0x9b031c2c
      - id: wifi_end
        layer: shared
        match: { route: multi_write_tx, com_type: wifi, position: 255 }
        let:
          cred: =decode('govee_upload', state.upload_buf + bytes(0x10000), upload_kind.wifi_credentials, upload_form.wire)
          ok: "=cred is not None and cred.value.len_ssid < 0x22 and cred.value.len_password < 0x42 and (cred.value.len_password == 0 or cred.value.len_password >= 8)"
        when: =state.wifi_count == state.wifi_counter and ok
        apply: after_reply
        effects:
          - push: wifi_status
        reply:
          route: multi_write_rx
          fill: request
          body: { com_type: wifi, result: 0 }
        doc: |
          A1 11 END with every packet taken and credentials it accepts: the ack
          echoes END bytes 3..18, then the attempt to join ends in EE 11.
        doc-ref:
          - H5083 ble_msg_receive_mult_package @0x9b031c2c
          - H5083 FUN_9b0315fc @0x9b0315fc
          - H5083 FUN_9b031e00 @0x9b031e00
      - id: wifi_end_rejected
        layer: shared
        match: { route: multi_write_tx, com_type: wifi, position: 255 }
        when: =state.wifi_count == state.wifi_counter
        effects:
          - push: wifi_rejected
        forward: true
        doc: |
          Credentials it rejects (an SSID of 34 or more, a password of 66 or more,
          or of 1..7) get EE 11 01 01 and no ack. The frame goes on with byte 2
          set to 1, which the dispatcher takes as A1 DATA 1 (not modelled).
        doc-ref:
          - H5083 ble_msg_receive_mult_package @0x9b031cde-0x9b031cea
          - H5083 FUN_9b0315fc @0x9b0315fc
      - id: wifi_end_short
        layer: shared
        match: { route: multi_write_tx, com_type: wifi, position: 255 }
        forward: true
        doc: an A1 11 END with packets missing is not acked; it goes on and is dropped
        doc-ref:
          - H5083 ble_msg_receive_mult_package @0x9b031c2c
      - id: iot_start
        layer: shared
        match: { route: multi_write_v1_tx, index: 0 }
        effects:
          - set: { state.iot_count: =req.start.num_packets, state.iot_counter: 0, state.upload_buf: "=raw[4:19] + bytes(241)" }
        forward: true
        doc: |
          FIRMWARE-SOURCED, A3 START (a count of all frames, START and END
          included): the upload buffer takes frame bytes 4.. (the comm byte, then
          data) whatever the marker. No reply; every A3 frame goes on and is
          dropped.
        doc-ref:
          - H5083 FUN_9b03289c @0x9b03296a-0x9b032994
      - id: iot_data
        layer: shared
        match: { route: multi_write_v1_tx }
        when: =req.index != 255
        let:
          at: =req.index * 17 - 2
        effects:
          - when: =req.index == state.iot_counter + 1
            set: { state.iot_counter: =state.iot_counter + 1, state.upload_buf: "=state.upload_buf[:at] + req.chunk + state.upload_buf[at + 17:]" }
        forward: true
        doc: FIRMWARE-SOURCED, A3 DATA, 17 bytes each, taken only in order; no reply
        doc-ref:
          - H5083 FUN_9b03289c @0x9b03289c
      - id: iot_end
        layer: shared
        match: { route: multi_write_v1_tx, index: 255 }
        let:
          taken: =state.iot_counter + 1
          done: =taken + 1 == state.iot_count
          at: =taken * 17 - 2
        effects:
          - set: { state.iot_counter: =taken }
          - when: =done
            set: { state.upload_buf: "=state.upload_buf[:at] + req.chunk + state.upload_buf[at + 17:]" }
          - when: =done and state.upload_buf[0] == comm_byte.iot_config
            push: iot_status
        forward: true
        doc: |
          FIRMWARE-SOURCED, A3 END. Complete, with the comm byte 08 still at the
          head of the buffer (an A1 11 START clears it), the IoT server config
          runs, whatever its URL length, and ends in A3 08.
        doc-ref:
          - H5083 FUN_9b03289c @0x9b0329e0-0x9b032a2a
          - H5083 FUN_9b0317b4 @0x9b0317c8-0x9b0317f4
          - H5083 FUN_9b0320bc @0x9b0321dc
      - id: pact_report
        layer: shared
        match: { route: wifi_multi_tx, command: pact_report }
        let:
          sent: =(req.args.pact_type - 0x10000 if req.args.pact_type >= 0x8000 else req.args.pact_type) * 256 + req.args.pact_code
        effects:
